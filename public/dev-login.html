<!doctype html>
<!-- 로컬 개발 전용 임시 파일: ?token=<JWT>&next=<경로> 로 열면 localStorage 에 토큰을 넣고 이동한다. 확인 끝나면 삭제. -->
<html lang="ko">
<head><meta charset="utf-8"><title>dev login</title></head>
<body style="font-family:sans-serif;padding:24px;background:#030712;color:#e5e7eb">
<p id="msg">로그인 처리 중…</p>
<script>
  try {
    var q = new URLSearchParams(location.search)
    var token = q.get('token')
    var next = q.get('next') || '/'
    if (!token) {
      document.getElementById('msg').textContent = 'token 파라미터가 없습니다.'
    } else {
      localStorage.setItem('token', token)
      location.replace(next)
    }
  } catch (e) {
    document.getElementById('msg').textContent = '실패: ' + e.message
  }
</script>
</body>
</html>
